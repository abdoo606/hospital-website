# docker compose up -d
#
# Serves the public website, the API and the staff panel on port 4000,
# keeping the database and uploaded photography in a named volume so they
# survive container rebuilds.

services:
  hospital-cms:
    build: .
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: '4000'
      TRUST_PROXY: '1'
      COOKIE_SAMESITE: lax
      # These values are deliberately mandatory: never deploy the public demo secret/password.
      # Generate SESSION_SECRET with: openssl rand -base64 48
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
    volumes:
      # Location of hospital.db, uploads/ and .session-secret
      - hospital-data:/app/server/data

volumes:
  hospital-data:
